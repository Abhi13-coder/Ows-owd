name: Build ows-cli (standalone)

on:
  workflow_dispatch:

jobs:
  find-root:
    name: Locate project root
    runs-on: ubuntu-latest
    outputs:
      project_dir: ${{ steps.find.outputs.project_dir }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          if [ -f "./settings.gradle.kts" ] || [ -f "./settings.gradle" ]; then
            DIR="."
          else
            FOUND=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
            if [ -z "$FOUND" ]; then
              echo "No settings.gradle(.kts) found"
              exit 1
            fi
            DIR=$(dirname "$FOUND")
          fi
          DIR="${DIR#./}"
          echo "project_dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Using project root: $DIR"

  cli:
    name: Build ows-cli (JVM tool)
    runs-on: ubuntu-latest
    needs: find-root
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      # No Android SDK step — ows-cli is a plain Kotlin/JVM module, and this
      # workflow is deliberately separate from build.yml (which builds the
      # AAR + APK) so dispatching this one never rebuilds those.
      - name: Generate wrapper + build ows-cli distribution
        working-directory: ${{ needs.find-root.outputs.project_dir }}
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew :ows-cli:distZip --stacktrace --no-daemon

      - name: Upload ows-cli (runnable JVM tool)
        uses: actions/upload-artifact@v4
        with:
          name: ows-cli
          path: "**/ows-cli/build/distributions/*.zip"
          if-no-files-found: error
