name: Build OWS Language PKG + IDE App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  find-and-build:
    name: Locate Gradle root + build
    runs-on: ubuntu-latest
    outputs:
      project_dir: ${{ steps.find.outputs.project_dir }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Gradle project root (gradlew)
        id: find
        run: |
          # Prefer repo-root gradlew, else first nested gradlew
          if [ -f "./gradlew" ]; then
            DIR="."
          else
            FOUND=$(find . -name gradlew -type f | head -n 1)
            if [ -z "$FOUND" ]; then
              echo "No gradlew found in repository"
              exit 1
            fi
            DIR=$(dirname "$FOUND")
          fi
          # normalize ./foo -> foo, . stays .
          DIR="${DIR#./}"
          echo "project_dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Using Gradle root: $DIR"
          ls -la "$DIR"

  language-pkg:
    name: Build OWS language PKG (AAR)
    runs-on: ubuntu-latest
    needs: find-and-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build ows-core AAR
        working-directory: ${{ needs.find-and-build.outputs.project_dir }}
        run: |
          chmod +x gradlew
          ./gradlew :ows-core:assembleRelease :ows-core:assembleDebug --stacktrace --no-daemon

      - name: Upload language PKG (release AAR)
        uses: actions/upload-artifact@v4
        with:
          name: ows-language-pkg-release
          path: "**/ows-core/build/outputs/aar/ows-core-release.aar"
          if-no-files-found: error

      - name: Upload language PKG (debug AAR)
        uses: actions/upload-artifact@v4
        with:
          name: ows-language-pkg-debug
          path: "**/ows-core/build/outputs/aar/ows-core-debug.aar"
          if-no-files-found: error

  app:
    name: Build IDE app (APK)
    runs-on: ubuntu-latest
    needs: find-and-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build debug APK
        working-directory: ${{ needs.find-and-build.outputs.project_dir }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload IDE app (debug APK)
        uses: actions/upload-artifact@v4
        with:
          name: ows-ide-app-debug
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
