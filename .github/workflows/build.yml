name: Build OWS Language PKG + IDE App

on:
  workflow_dispatch:

jobs:
  find-root:
    name: Locate project root
    runs-on: ubuntu-latest
    outputs:
      project_dir: ${{ steps.find.outputs.project_dir }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          if [ -f "./settings.gradle.kts" ] || [ -f "./settings.gradle" ]; then
            DIR="."
          else
            FOUND=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
            if [ -z "$FOUND" ]; then
              echo "No settings.gradle(.kts) found"
              exit 1
            fi
            DIR=$(dirname "$FOUND")
          fi
          DIR="${DIR#./}"
          echo "project_dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Using project root: $DIR"

  language-pkg:
    name: Build OWS language PKG (AAR)
    runs-on: ubuntu-latest
    needs: find-root
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses + install SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Generate wrapper + build ows-core AAR
        working-directory: ${{ needs.find-root.outputs.project_dir }}
        run: |
          # CI generates a valid wrapper (ignores broken repo gradlew)
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew :ows-core:assembleRelease :ows-core:assembleDebug --stacktrace --no-daemon

      - name: Upload language PKG (release AAR)
        uses: actions/upload-artifact@v4
        with:
          name: ows-language-pkg-release
          path: "**/ows-core/build/outputs/aar/ows-core-release.aar"
          if-no-files-found: error

      - name: Upload language PKG (debug AAR)
        uses: actions/upload-artifact@v4
        with:
          name: ows-language-pkg-debug
          path: "**/ows-core/build/outputs/aar/ows-core-debug.aar"
          if-no-files-found: error

  app:
    name: Build IDE app (APK)
    runs-on: ubuntu-latest
    needs: find-root
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses + install SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Generate wrapper + build debug APK
        working-directory: ${{ needs.find-root.outputs.project_dir }}
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload IDE app (debug APK)
        uses: actions/upload-artifact@v4
        with:
          name: ows-ide-app-debug
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
